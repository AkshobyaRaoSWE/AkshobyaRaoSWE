<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4326" stop-opacity="0"/>
      <stop offset="14%" stop-color="#ff4326" stop-opacity=".9"/>
      <stop offset="60%" stop-color="#ff7a5c" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff4326" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15151a"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="r"><rect width="1280" height="460" rx="26"/></clipPath>
    <path id="wave" d="M -60 388 C 160 372, 300 404, 470 386 C 560 376, 620 398, 700 388 L 812 388 L 832 388 L 845 360 L 860 416 L 874 372 L 888 388 L 980 388 C 1120 388, 1240 384, 1360 390" fill="none"/>
    <path id="cartrack" d="M -60 388 C 160 372, 300 404, 470 386 C 560 376, 620 398, 700 388 L 800 388" fill="none"/>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1280" height="460" fill="url(#fade)"/>

    <!-- telemetry grid -->
    <g stroke="#ffffff" stroke-opacity="0.045">
      <line x1="160" y1="0" x2="160" y2="460"/><line x1="320" y1="0" x2="320" y2="460"/>
      <line x1="480" y1="0" x2="480" y2="460"/><line x1="640" y1="0" x2="640" y2="460"/>
      <line x1="800" y1="0" x2="800" y2="460"/><line x1="960" y1="0" x2="960" y2="460"/>
      <line x1="1120" y1="0" x2="1120" y2="460"/>
      <line x1="0" y1="115" x2="1280" y2="115"/><line x1="0" y1="345" x2="1280" y2="345"/>
    </g>

    <!-- top bar -->
    <circle cx="46" cy="44" r="5" fill="#ff4326">
      <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="49" font-size="13" letter-spacing="3" fill="#ff4326" font-weight="bold">LIVE</text>
    <text x="104" y="49" font-size="13" letter-spacing="3" fill="#8c8c88">TELEMETRY // AKSHOBYA RAO</text>
    <text x="1234" y="49" font-size="12.5" letter-spacing="2" fill="#8c8c88" text-anchor="end">NAPERVILLE, IL &#183; EST. 2028</text>

    <!-- equalizer / telemetry bars (top right) -->
    <g fill="#ff4326">
      <rect x="1040" y="86" width="11" height="40" opacity=".9"><animate attributeName="height" values="40;14;58;26;40" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="1058" y="86" width="11" height="26" opacity=".75"><animate attributeName="height" values="26;54;18;44;26" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="1076" y="86" width="11" height="50" opacity=".9"><animate attributeName="height" values="50;20;60;30;50" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="1094" y="86" width="11" height="18" opacity=".6"><animate attributeName="height" values="18;48;28;58;18" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="1112" y="86" width="11" height="44" opacity=".85"><animate attributeName="height" values="44;16;52;24;44" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="1130" y="86" width="11" height="30" opacity=".7"><animate attributeName="height" values="30;58;20;46;30" dur="1.45s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="1040" y="150" width="111" height="2" fill="#ffffff" opacity=".12"/>
    <text x="1040" y="172" font-size="11" letter-spacing="2" fill="#5b5b58">SIGNAL / NOISE RATIO</text>

    <!-- headline -->
    <text x="44" y="222" font-size="86" font-weight="bold" letter-spacing="-3" fill="#f3f1ea">I FIND THE <tspan fill="#ff4326">SIGNAL</tspan></text>
    <text x="44" y="308" font-size="86" font-weight="bold" letter-spacing="-3" fill="#f3f1ea">IN THE NOISE.</text>

    <!-- tagline -->
    <text x="46" y="348" font-size="15" letter-spacing="1.5" fill="#8c8c88" font-family="ui-monospace,'SF Mono','Roboto Mono',monospace">FUTURE ENGINEER &#160;//&#160; FORMULA 1 &#43; BIOTECH &#160;//&#160; CARS THAT THINK, SENSORS THAT LISTEN</text>

    <!-- signal trace -->
    <use href="#wave" stroke="url(#sig)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- heartbeat at the right end -->
    <circle cx="980" cy="388" r="4" fill="#ff7a5c" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.4;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- F1 car driving the trace -->
    <g>
      <g transform="translate(-200,0)">
        <rect x="-40" y="-12" width="6" height="12" rx="1.4" fill="#b00500"/>
        <path d="M-34 2 L-29 -5 L-9 -9 L8 -11 L25 -8 L42 -4 L42 2 L38 7 L-30 7 Z" fill="#ff4326"/>
        <path d="M-6 -9 a8 8 0 0 1 15 0 Z" fill="#0a0a0b" opacity=".9"/>
        <rect x="38" y="0" width="10" height="4" rx="1" fill="#b00500"/>
        <circle cx="-22" cy="7" r="7.5" fill="#0a0a0b"/><circle cx="-22" cy="7" r="3" fill="#3a3a3a"/>
        <circle cx="26" cy="7" r="7.5" fill="#0a0a0b"/><circle cx="26" cy="7" r="3" fill="#3a3a3a"/>
        <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" calcMode="linear"><mpath href="#cartrack"/></animateMotion>
      </g>
    </g>
  </g>
</svg>
