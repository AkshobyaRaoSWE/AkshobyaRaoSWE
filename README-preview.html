botics work that taught me real-time control.</sub>\n\n[`akshobya.vercel.app`](https://akshobya.vercel.app) &nbsp;\u00b7&nbsp; [`studentteachers.dev`](https://studentteachers.dev) &nbsp;\u00b7&nbsp; [`fifty-labs`](https://fifty-labs.vercel.app) &nbsp;\u00b7&nbsp; [`ilref.org`](https://www.ilref.org) &nbsp;\u00b7&nbsp; [`removebg`](https://github.com/AkshobyaRaoSWE/removebg) &nbsp;\u00b7&nbsp; [`file_converter`](https://github.com/AkshobyaRaoSWE/file_converter) &nbsp;\u00b7&nbsp; [`VEX 2360C`](https://github.com/AkshobyaRaoSWE/2360C)\n\n<br/>\n\n## &nbsp;Let's talk\n\nIf you're into motorsport, biotech, control systems, or just building things that touch the physical world \u2014 reach out.\n\n<div align=\"center\">\n\n[![Email](https://img.shields.io/badge/akshobyaraoglobal@gmail.com-1d1d1f?style=for-the-badge&logo=gmail&logoColor=white)](mailto:akshobyaraoglobal@gmail.com)\n&nbsp;\n[![LinkedIn](https://img.shields.io/badge/LinkedIn-0a6cff?style=for-the-badge&logo=linkedin&logoColor=white)](https://www.linkedin.com/in/akshobya-rao-a852a0361/)\n\n<sub><i>Finding the signal in the noise.</i></sub>\n\n</div>\n");</script></body></html>
